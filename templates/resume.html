<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Upload</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg,#0f2027,#203a43,#2c5364);
    color: white;
    text-align: center;
    padding: 50px;
}

.container {
    background: rgba(255,255,255,0.1);
    padding: 30px;
    border-radius: 12px;
    width: 400px;
    margin: auto;
}

input[type="file"] {
    margin: 20px 0;
}

button {
    padding: 10px 20px;
    border: none;
    background: #00c6ff;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #0072ff;
}

a {
    display: block;
    margin-top: 20px;
    color: #00c6ff;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">
    <h1>📄 Resume Upload</h1>

    <!-- ✅ FLASH MESSAGE -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- ✅ FORM -->
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="resume" required>
        <br>
        <button type="submit">Upload Resume</button>
    </form>

    <!-- ✅ BACK BUTTON -->
    <a href="{{ url_for('dashboard') }}">⬅ Back to Dashboard</a>
</div>

</body>
</html>
