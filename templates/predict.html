<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Career Predictor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
background:linear-gradient(120deg,#0f2027,#203a43,#2c5364);
display:flex;
align-items:center;
justify-content:center;
color:white;
}

/* Card Container */

.container{
width:800px;
padding:40px;
border-radius:20px;

background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);

box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

/* Main Heading */

.main-heading{
text-align:center;
font-size:42px;
font-weight:800;
color:#4fd1c5;
margin-bottom:10px;
}

/* Sub Heading */

.sub-heading{
text-align:center;
font-size:20px;
font-weight:600;
color:#ffffff;
margin-bottom:40px;
}

/* Form Label */

label{
display:block;
font-size:16px;
font-weight:600;
margin-bottom:6px;
color:#e2e8f0;
}

/* Inputs */

input{
width:100%;
padding:14px;
border-radius:10px;
border:none;
outline:none;

background:rgba(0,0,0,0.6);
color:white;

margin-bottom:22px;
font-size:15px;
}

input::placeholder{
color:#cbd5e1;
}

/* Button */

button{

width:100%;
padding:16px;

border:none;
border-radius:12px;

font-size:18px;
font-weight:700;

background:linear-gradient(90deg,#00c6ff,#0072ff);

color:white;

cursor:pointer;
transition:0.3s;
}

button:hover{

transform:translateY(-3px);
box-shadow:0 12px 25px rgba(0,0,0,0.5);

}

/* Result */

.result-box{

margin-top:35px;
padding:25px;

border-radius:12px;

background:rgba(0,0,0,0.5);
border-left:5px solid #00c6ff;

}

.result-title{
font-size:22px;
font-weight:700;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

<h1 class="main-heading">
AI Career Predictor
</h1>

<p class="sub-heading">
Analyze your interests and discover the best career path for you
</p>

<form method="POST">

<label>Technology Interest (1-5)</label> <input name="tech" placeholder="Enter value between 1 and 5">

<label>Medical Interest (1-5)</label> <input name="medical" placeholder="Enter value between 1 and 5">

<label>Law Interest (1-5)</label> <input name="law" placeholder="Enter value between 1 and 5">

<label>Sports Interest (1-5)</label> <input name="sports" placeholder="Enter value between 1 and 5">

<label>Creative Interest (1-5)</label> <input name="art" placeholder="Enter value between 1 and 5">

<button>
Predict Career
</button>

</form>

{% if result %}

<div class="result-box">

<div class="result-title">
Recommended Career: {{ result }}
</div>

{% endif %}

{% if roadmap %}

<ol>

{% for step in roadmap %}

<li>{{ step }}</li>

{% endfor %}

</ol>

{% endif %}

</div>

</div>

</body>

</html>
