<!DOCTYPE html>
<html>

<head>
<title>AI Career Chatbot</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

<h2 class="text-center">AI Career Mentor Chatbot</h2>

<form method="POST">

<div class="mb-3">
<label>Ask your career question</label>
<input type="text" name="question" class="form-control">
</div>

<button class="btn btn-primary">Ask</button>

</form>

{% if answer %}
<hr>
<h4>Bot Answer:</h4>
<p>{{ answer }}</p>
{% endif %}

</div>

</body>

</html>
