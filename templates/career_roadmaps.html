<!DOCTYPE html>

<html>

<head>

<title>Professional Career Roadmaps</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

body{
background:#0d1b2a;
color:white;
font-family:Segoe UI;
}

.header{
text-align:center;
margin-top:40px;
margin-bottom:40px;
}

.roadmap-card{
background:#1b2a44;
padding:25px;
border-radius:15px;
margin-bottom:30px;
}

.timeline{
border-left:4px solid #1e90ff;
padding-left:20px;
}

.timeline-step{
margin-bottom:15px;
padding:10px;
background:#1e2a4d;
border-radius:8px;
}

.btn-roadmap{
background:#1e90ff;
border:none;
margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>Career Roadmaps</h1>
<p>Explore professional learning paths</p>
</div>

{% for r in roadmaps %}

<div class="roadmap-card">

<h3>{{ r.name }}</h3>

<div class="timeline">

{% for step in r.steps %}

<div class="timeline-step">
{{ step }}
</div>

{% endfor %}

</div>

<a href="{{ r.site }}" target="_blank"
class="btn btn-roadmap">
Open Full Roadmap </a>

</div>

{% endfor %}

</div>

</body>

</html>
