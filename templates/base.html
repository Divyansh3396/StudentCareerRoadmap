<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Career Roadmap{% endblock %}</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Mermaid.js -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: true, theme: 'dark' });
    </script>

    <style>
        /* General Dark Theme */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }

        a, .nav-link {
            color: #ffffff;
        }

        a:hover, .nav-link:hover {
            color: #1e90ff;
        }

        .navbar {
            background-color: #1f1f1f !important;
        }

        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        button.btn-primary {
            background-color: #1e90ff;
            border-radius: 8px;
            font-weight: 500;
        }

        button.btn-primary:hover {
            background-color: #63b3ed;
        }

        .form-control {
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 8px;
        }

        h2, h3, h4 {
            font-weight: 600;
            color: #ffffff;
        }

        .roadmap {
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border-left: 5px solid #1e90ff;
        }

        .result-title {
            color: #ffffff;
            font-weight: bold;
        }

        .mermaid {
            text-align: center;
            color: #ffffff;
        }

        .panel {
            padding: 15px;
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">CareerRoadmap</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navmenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/career">Career Test</a></li>
                    <li class="nav-item"><a class="nav-link" href="/predict">AI Predictor</a></li>
                    <li class="nav-item"><a class="nav-link" href="/resume">Resume Builder</a></li>
                    <li class="nav-item"><a class="nav-link" href="/roadmap">Roadmap</a></li>
                    <li class="nav-item"><a class="nav-link" href="/linkedin">LinkedIn Upload</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
